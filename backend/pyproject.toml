[project]
name = "s-paper"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
 "sqlalchemy>=2.0.39,<2.1", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4",
 "httpx>=0.28,<1", "celery[redis]>=5.5,<6", "redis>=5,<7", "argon2-cffi>=23,<26",
 "openai>=2,<3", "google-genai>=1,<2", "defusedxml>=0.7,<1", "beautifulsoup4>=4.13,<5",
 "email-validator>=2,<3", "python-multipart>=0.0.20,<1"
]
[dependency-groups]
dev = ["pytest>=8,<10", "respx>=0.22,<1", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: paid external API verification", "postgres: PostgreSQL concurrency verification"]
[tool.ruff]
line-length = 120
